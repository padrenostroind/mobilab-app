<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobiLab Gestionale</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #00e676;
            --accent-blue: #2979ff;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff5252;
            --warning: #ffb300;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #333; margin-bottom: 15px; }
        header h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; }
        
        /* Layout adattivo per Z Fold: 1 colonna da chiuso, griglia da aperto */
        .fold-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 750px) {
            .fold-grid { grid-template-columns: 1fr 1fr; }
        }

        .panel { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #2a2a2a; margin-bottom: 16px; }
        .panel h2 { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; padding-bottom: 8px; }

        .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 120px; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #262626; color: #fff; font-size: 0.95rem; }
        button { padding: 10px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-add { background: var(--accent); color: #000; width: 100%; margin-top: 4px; }
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
        .btn-del { background: var(--danger); color: #fff; }
        .btn-status { background: var(--accent-blue); color: #fff; }

        .search-box { width: 100%; margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.9rem; }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
        .item-card { background: #262626; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-left: 4px solid var(--accent); }
        .item-card.wait { border-left-color: var(--warning); }
        .item-card.done { border-left-color: var(--accent-blue); opacity: 0.8; }
        .item-info h3 { font-size: 1rem; margin-bottom: 3px; }
        .item-info p { font-size: 0.82rem; color: var(--text-muted); }
        .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-top: 4px; background: #333; }
        .actions { display: flex; align-items: center; gap: 6px; }
        .qty-box { font-size: 1.1rem; font-weight: bold; min-width: 28px; text-align: center; }
        .low-stock { color: var(--danger); }
        .price-tag { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🔧 MobiLab Gestionale</h1>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Z Fold Edition</span>
    </header>

    <div class="fold-grid">
        <!-- COLONNA SINISTRA: LAVORI E CALENDARIO -->
        <div>
            <div class="panel">
                <h2>📅 Nuovo Lavoro / Riparazione</h2>
                <div class="form-row">
                    <input type="text" id="jobClient" placeholder="Cliente (es. Mario Rossi)">
                    <input type="text" id="jobDevice" placeholder="Dispositivo (es. iPhone 13)">
                </div>
                <div class="form-row">
                    <input type="text" id="jobIssue" placeholder="Intervento (es. Cambio Display)">
                    <input type="date" id="jobDate">
                </div>
                <div class="form-row">
                    <input type="number" id="jobPrice" placeholder="Prezzo €">
                    <select id="jobStatus">
                        <option value="In Corso">🔧 In Corso</option>
                        <option value="Attesa Ricambi">⏳ Attesa Ricambi</option>
                        <option value="Pronto">✅ Pronto</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addJob()">+ Aggiungi Lavoro</button>
            </div>

            <div class="panel">
                <h2>📋 Lavori in Corso</h2>
                <input type="text" id="searchJob" class="search-box" placeholder="🔍 Cerca cliente o dispositivo..." oninput="render()">
                <ul id="jobList" class="item-list"></ul>
            </div>
        </div>

        <!-- COLONNA DESTRA: MAGAZZINO E LISTINO -->
        <div>
            <div class="panel">
                <h2>📦 Magazzino Fisico</h2>
                <input type="text" id="searchInv" class="search-box" placeholder="🔍 Cerca ricambio in magazzino..." oninput="render()">
                <div class="form-row" style="margin-top: 8px;">
                    <input type="text" id="invName" placeholder="Articolo (es. Display iPhone 12)">
                    <input type="number" id="invQty" placeholder="Q.tà" value="1" style="max-width: 80px;">
                </div>
                <button class="btn-add" onclick="addInv()">+ Carica in Magazzino</button>
                <ul id="invList" class="item-list" style="margin-top: 12px;"></ul>
            </div>

            <div class="panel">
                <h2>💶 Listino Prezzi di Riferimento</h2>
                <input type="text" id="searchPriceList" class="search-box" placeholder="🔍 Cerca nel listino..." oninput="render()">
                <div class="form-row" style="margin-top: 8px;">
                    <input type="text" id="priceItem" placeholder="Nome Ricambio / Modello">
                    <input type="number" id="priceValue" placeholder="Prezzo €" style="max-width: 100px;">
                </div>
                <button class="btn-add" style="background:var(--accent-blue); color:#fff;" onclick="addPriceListItem()">+ Aggiungi a Listino</button>
                <ul id="priceList" class="item-list" style="margin-top: 12px;"></ul>
            </div>
        </div>
    </div>

    <script>
        let jobs = JSON.parse(localStorage.getItem('mobilab_jobs')) || [];
        let inventory = JSON.parse(localStorage.getItem('mobilab_inv')) || [];
        let priceList = JSON.parse(localStorage.getItem('mobilab_prices')) || [
            { id: 1, name: 'Display iPhone 11 (OLED)', price: 45 },
            { id: 2, name: 'Display iPhone 12 / 12 Pro (OLED)', price: 55 },
            { id: 3, name: 'Batteria iPhone 11', price: 20 },
            { id: 4, name: 'Batteria iPhone 12 / 12 Pro', price: 25 }
        ];

        document.getElementById('jobDate').valueAsDate = new Date();

        function saveData() {
            localStorage.setItem('mobilab_jobs', JSON.stringify(jobs));
            localStorage.setItem('mobilab_inv', JSON.stringify(inventory));
            localStorage.setItem('mobilab_prices', JSON.stringify(priceList));
            render();
        }

        function addJob() {
            const client = document.getElementById('jobClient').value.trim();
            const device = document.getElementById('jobDevice').value.trim();
            const issue = document.getElementById('jobIssue').value.trim();
            const date = document.getElementById('jobDate').value;
            const price = document.getElementById('jobPrice').value || '0';
            const status = document.getElementById('jobStatus').value;

            if (!client || !device) return alert("Inserisci almeno Cliente e Dispositivo!");

            jobs.unshift({ id: Date.now(), client, device, issue, date, price, status });
            document.getElementById('jobClient').value = '';
            document.getElementById('jobDevice').value = '';
            document.getElementById('jobIssue').value = '';
            document.getElementById('jobPrice').value = '';
            saveData();
        }

        function cycleStatus(id) {
            const states = ['In Corso', 'Attesa Ricambi', 'Pronto'];
            jobs = jobs.map(j => {
                if (j.id === id) {
                    let next = (states.indexOf(j.status) + 1) % states.length;
                    j.status = states[next];
                }
                return j;
            });
            saveData();
        }

        function deleteJob(id) {
            if(confirm("Eliminare questo lavoro?")) {
                jobs = jobs.filter(j => j.id !== id);
                saveData();
            }
        }

        function addInv() {
            const name = document.getElementById('invName').value.trim();
            const qty = parseInt(document.getElementById('invQty').value) || 0;
            if (!name) return alert("Inserisci il nome del ricambio!");
            inventory.unshift({ id: Date.now(), name, qty });
            document.getElementById('invName').value = '';
            document.getElementById('invQty').value = '1';
            saveData();
        }

        function updateQty(id, delta) {
            inventory = inventory.map(item => {
                if (item.id === id) item.qty = Math.max(0, item.qty + delta);
                return item;
            });
            saveData();
        }

        function deleteInv(id) {
            if(confirm("Rimuovere l'articolo?")) {
                inventory = inventory.filter(i => i.id !== id);
                saveData();
            }
        }

        function addPriceListItem() {
            const name = document.getElementById('priceItem').value.trim();
            const price = parseFloat(document.getElementById('priceValue').value) || 0;
            if (!name) return alert("Inserisci il nome del ricambio per il listino!");
            priceList.unshift({ id: Date.now(), name, price });
            document.getElementById('priceItem').value = '';
            document.getElementById('priceValue').value = '';
            saveData();
        }

        function deletePriceItem(id) {
            if(confirm("Eliminare dal listino?")) {
                priceList = priceList.filter(p => p.id !== id);
                saveData();
            }
        }

        function render() {
            const searchJobVal = document.getElementById('searchJob').value.toLowerCase();
            const jobList = document.getElementById('jobList');
            const filteredJobs = jobs.filter(j => j.client.toLowerCase().includes(searchJobVal) || j.device.toLowerCase().includes(searchJobVal));
            
            jobList.innerHTML = filteredJobs.length ? '' : '<p style="color:#777; font-size:0.9rem; padding:6px;">Nessun lavoro trovato.</p>';
            filteredJobs.forEach(j => {
                let statusClass = j.status === 'Attesa Ricambi' ? 'wait' : (j.status === 'Pronto' ? 'done' : '');
                jobList.innerHTML += `
                    <li class="item-card ${statusClass}">
                        <div class="item-info">
                            <h3>${j.device} - ${j.client}</h3>
                            <p>${j.issue || 'Riparazione'} • 📅 ${j.date} • <span class="price-tag">€${j.price}</span></p>
                            <span class="badge">${j.status}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-status" onclick="cycleStatus(${j.id})">Stato</button>
                            <button class="btn-sm btn-del" onclick="deleteJob(${j.id})">✕</button>
                        </div>
                    </li>
                `;
            });

            const searchInvVal = document.getElementById('searchInv').value.toLowerCase();
            const invList = document.getElementById('invList');
            const filteredInv = inventory.filter(i => i.name.toLowerCase().includes(searchInvVal));
            
            invList.innerHTML = filteredInv.length ? '' : '<p style="color:#777; font-size:0.9rem; padding:6px;">Nessun ricambio in magazzino.</p>';
            filteredInv.forEach(i => {
                let lowClass = i.qty === 0 ? 'low-stock' : '';
                invList.innerHTML += `
                    <li class="item-card">
                        <div class="item-info">
                            <h3>${i.name}</h3>
                        </div>
                        <div class="actions">
                            <button class="btn-sm" style="background:#444;color:#fff;" onclick="updateQty(${i.id}, -1)">-</button>
                            <span class="qty-box ${lowClass}">${i.qty}</span>
                            <button class="btn-sm" style="background:#444;color:#fff;" onclick="updateQty(${i.id}, 1)">+</button>
                            <button class="btn-sm btn-del" onclick="deleteInv(${i.id})">✕</button>
                        </div>
                    </li>
                `;
            });

            const searchPriceVal = document.getElementById('searchPriceList').value.toLowerCase();
            const priceListElement = document.getElementById('priceList');
            const filteredPrices = priceList.filter(p => p.name.toLowerCase().includes(searchPriceVal));

            priceListElement.innerHTML = filteredPrices.length ? '' : '<p style="color:#777; font-size:0.9rem; padding:6px;">Nessun prezzo in listino.</p>';
            filteredPrices.forEach(p => {
                priceListElement.innerHTML += `
                    <li class="item-card" style="border-left-color: var(--accent-blue);">
                        <div class="item-info">
                            <h3>${p.name}</h3>
                            <p class="price-tag">Prezzo: €${p.price}</p>
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-del" onclick="deletePriceItem(${p.id})">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        render();
    </script>
</body>
</html>
